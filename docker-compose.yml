services:

  # ── Spark Feedback UI ─────────────────────────────────────────────────────────
  spark-feedback-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090}
    container_name: spark_feedback_ui
    ports:
      - "3003:80"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
